components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LessonType:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        durationMinutes:
          type: number
        priceCents:
          type: number
        description:
          type: string
        isActive:
          type: boolean
        isTrial:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - durationMinutes
        - priceCents
        - description
        - isActive
        - isTrial
        - createdAt

    LessonTypeInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        durationMinutes:
          type: number
          minimum: 15
        priceCents:
          type: number
          minimum: 0
        description:
          type: string
        isActive:
          type: boolean
        isTrial:
          type: boolean
      required:
        - name
        - durationMinutes
        - priceCents
        - description

    LessonTypeUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        durationMinutes:
          type: number
          minimum: 15
        priceCents:
          type: number
          minimum: 0
        description:
          type: string
        isActive:
          type: boolean
        isTrial:
          type: boolean

    LessonTypePackage:
      type: object
      properties:
        id:
          type: number
        lessonTypeId:
          type: number
        quantity:
          type: number
        totalCents:
          type: number
        sortOrder:
          type: number
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - lessonTypeId
        - quantity
        - totalCents
        - sortOrder
        - isActive
        - createdAt

    LessonTypePackageInput:
      type: object
      properties:
        lessonTypeId:
          type: number
        quantity:
          type: number
          minimum: 2
        totalCents:
          type: number
          minimum: 0
        sortOrder:
          type: number
        isActive:
          type: boolean
      required:
        - lessonTypeId
        - quantity
        - totalCents

    LessonTypePackageUpdate:
      type: object
      properties:
        quantity:
          type: number
          minimum: 2
        totalCents:
          type: number
          minimum: 0
        sortOrder:
          type: number
        isActive:
          type: boolean

    LessonBalance:
      type: object
      properties:
        lessonTypeId:
          type: number
        lessonTypeName:
          type: string
        durationMinutes:
          type: number
        remaining:
          type: number
      required:
        - lessonTypeId
        - lessonTypeName
        - durationMinutes
        - remaining

    PackageRequest:
      type: object
      properties:
        id:
          type: number
        studentId:
          type: number
        studentName:
          type: string
        lessonTypeId:
          type: number
        lessonTypeName:
          type: string
        durationMinutes:
          type: number
        quantity:
          type: number
        totalCents:
          type: number
        status:
          type: string
          enum: [pending, paid, declined]
        note:
          type: string
          nullable: true
        requestedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - studentId
        - lessonTypeId
        - lessonTypeName
        - quantity
        - totalCents
        - status
        - requestedAt

    PackageRequestInput:
      type: object
      properties:
        lessonTypePackageId:
          type: number
        note:
          type: string
      required:
        - lessonTypePackageId

    PackageRequestResolve:
      type: object
      properties:
        status:
          type: string
          enum: [paid, declined]
      required:
        - status

    TimeSlot:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        available:
          type: boolean
          description: False when this slot overlaps a busy block (Google Calendar, a teacher time-off block, or an existing booking); the UI greys it out.
      required:
        - startTime
        - endTime
        - available

    CalendarBusyBlock:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    AvailabilityOverride:
      type: object
      properties:
        id:
          type: number
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
      required:
        - id
        - startTime
        - endTime

    SetDayOverridesInput:
      type: object
      properties:
        date:
          type: string
          description: The date whose overrides are being replaced, as "YYYY-MM-DD".
        blocks:
          type: array
          items:
            type: object
            properties:
              startTime:
                type: string
                format: date-time
              endTime:
                type: string
                format: date-time
            required:
              - startTime
              - endTime
      required:
        - date
        - blocks

    Booking:
      type: object
      properties:
        id:
          type: number
        lessonTypeId:
          type: number
        lessonTypeName:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [upcoming, completed, cancelled]
        meetLink:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - lessonTypeId
        - lessonTypeName
        - startTime
        - endTime
        - status
        - meetLink
        - createdAt

    BookingDetail:
      type: object
      properties:
        id:
          type: number
        lessonTypeId:
          type: number
        lessonTypeName:
          type: string
        durationMinutes:
          type: number
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [upcoming, completed, cancelled]
        meetLink:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
          description: The teacher's recap of the lesson, set when the booking is completed.
        homework:
          $ref: "#/components/schemas/Homework"
        review:
          $ref: "#/components/schemas/Review"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - lessonTypeId
        - lessonTypeName
        - durationMinutes
        - startTime
        - endTime
        - status
        - meetLink
        - notes
        - createdAt

    BookingInput:
      type: object
      properties:
        lessonTypeId:
          type: number
        startTime:
          type: string
          format: date-time
      required:
        - lessonTypeId
        - startTime

    CancellationInput:
      type: object
      properties:
        reason:
          type: string

    RescheduleInput:
      type: object
      properties:
        newStartTime:
          type: string
          format: date-time
      required:
        - newStartTime

    HomeworkFile:
      type: object
      properties:
        id:
          type: number
        slot:
          type: string
          enum: [assigned, submission, review]
        key:
          type: string
        name:
          type: string
        mime:
          type: string
        url:
          type: ["string", "null"]
        linkedFileId:
          type: ["number", "null"]
        originalFileId:
          type: ["number", "null"]
          description: "For a review file, the assigned file it should be shown alongside (only set when the tutor had the original visible while annotating)."
        sortOrder:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - slot
        - key
        - name
        - mime
        - url
        - linkedFileId
        - originalFileId
        - sortOrder
        - createdAt

    Homework:
      type: object
      properties:
        id:
          type: number
        bookingId:
          type: number
        noHomework:
          type: boolean
        assignedText:
          type: ["string", "null"]
        assignedLinkUrl:
          type: ["string", "null"]
        submittedText:
          type: ["string", "null"]
        submittedLinkUrl:
          type: ["string", "null"]
        tutorFeedback:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        submittedAt:
          type: ["string", "null"]
          format: date-time
        reviewedAt:
          type: ["string", "null"]
          format: date-time
        studentReviewSeenAt:
          type: ["string", "null"]
          format: date-time
          description: "When the student last viewed a review that is at least as new as reviewedAt. Null (or older than reviewedAt) means there's unseen tutor feedback."
        reminderActive:
          type: boolean
        assignedFiles:
          type: array
          items:
            $ref: "#/components/schemas/HomeworkFile"
        submissionFiles:
          type: array
          items:
            $ref: "#/components/schemas/HomeworkFile"
        reviewFiles:
          type: array

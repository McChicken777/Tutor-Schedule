openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Spanish Tutor Booking Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public endpoints (no auth required)
  - name: student
    description: Student endpoints (Clerk auth required)
  - name: teacher
    description: Teacher account endpoints (Clerk auth required, teacher row required for /teachers/me)
  - name: admin
    description: Admin endpoints (password session required)
  - name: uploads
    description: File upload/download endpoints shared by admin and student
  - name: internal
    description: Internal endpoints for scheduled jobs (shared-secret header, not a user session)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── INTERNAL (scheduled jobs) ───────────────────────────────────────────
  /internal/homework-reminders/run:
    post:
      operationId: runHomeworkReminderSweep
      tags: [internal]
      summary: Sweep for unsubmitted homework past its reminder due date and flag it
      description: Guarded by an X-Internal-Secret header (compared against INTERNAL_CRON_SECRET), not a user session. Intended to be hit hourly by a Replit Scheduled Deployment.
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkReminderSweepResult"
        "401":
          description: Missing or invalid X-Internal-Secret header

  /internal/homework-files-cleanup/run:
    post:
      operationId: runHomeworkFilesCleanupSweep
      tags: [internal]
      summary: Delete homework file blobs (and soft-delete their rows) 28 days after the lesson date
      description: Guarded by an X-Internal-Secret header (compared against INTERNAL_CRON_SECRET), not a user session. Intended to be hit daily by a Replit Scheduled Deployment. Skips files with an open report against them.
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkFilesCleanupSweepResult"
        "401":
          description: Missing or invalid X-Internal-Secret header

  # ─── PUBLIC ───────────────────────────────────────────────────────────────
  /lesson-types:
    get:
      operationId: listLessonTypes
      tags: [public]
      summary: List active lesson types
      responses:
        "200":
          description: List of lesson types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonType"

  /lesson-type-packages:
    get:
      operationId: listLessonTypePackages
      tags: [public]
      summary: List active bulk packages for all lesson types
      responses:
        "200":
          description: List of active packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonTypePackage"

  /available-slots:
    get:
      operationId: getAvailableSlots
      tags: [public]
      summary: Get available booking slots
      parameters:
        - name: lessonTypeId
          in: query
          required: true
          schema:
            type: number
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"

  /testimonials:
    get:
      operationId: listTestimonials
      tags: [public]
      summary: List visible testimonials
      responses:
        "200":
          description: List of testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"

  /faqs:
    get:
      operationId: listFaqs
      tags: [public]
      summary: List visible FAQ entries
      responses:
        "200":
          description: List of FAQ entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FaqEntry"

  /site-settings:
    get:
      operationId: getSiteSettings
      tags: [public]
      summary: Get public site settings
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  # ─── STUDENT ──────────────────────────────────────────────────────────────
  /student/me:
    get:
      operationId: getStudentProfile
      tags: [student]
      summary: Get current student profile and credit summary
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          description: Unauthorized

  /student/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [student]
      summary: Get student dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"
        "401":
          description: Unauthorized

  /student/bookings:
    get:
      operationId: listStudentBookings
      tags: [student]
      summary: List student's bookings
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [upcoming, past, cancelled]
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          description: Unauthorized
    post:
      operationId: createBooking
      tags: [student]
      summary: Book a lesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid input or no credits
        "401":
          description: Unauthorized

  /student/bookings/{id}:
    get:
      operationId: getStudentBooking
      tags: [student]
      summary: Get booking details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDetail"
        "404":
          description: Not found

  /student/bookings/{id}/cancel:
    patch:
      operationId: cancelBooking
      tags: [student]
      summary: Cancel a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationInput"
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Cannot cancel
        "404":
          description: Not found

  /student/bookings/{id}/reschedule:
    patch:
      operationId: rescheduleBooking
      tags: [student]
      summary: Reschedule a booking to a new time
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleInput"
      responses:
        "200":
          description: Booking rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Cannot reschedule
        "404":
          description: Not found

  /student/bookings/{id}/homework:
    get:
      operationId: getHomework
      tags: [student]
      summary: Get homework for a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Homework entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Homework"
        "404":
          description: Not found
    post:
      operationId: submitHomework
      tags: [student]
      summary: Submit homework for a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeworkInput"
      responses:
        "201":
          description: Homework submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Homework"
        "400":
          description: Invalid input
        "404":
          description: Not found

  /student/homework:
    get:
      operationId: listStudentHomework
      tags: [student]
      summary: List all homework for the logged-in student across all bookings
      responses:
        "200":
          description: All homework for the current student
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherHomework"

  /student/homework/{id}/seen:
    post:
      operationId: markHomeworkReviewSeen
      tags: [student]
      summary: Mark a homework's tutor review as seen by the student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Marked as seen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherHomework"
        "404":
          description: Not found

  /student/bookings/{id}/review:
    post:
      operationId: submitReview
      tags: [student]
      summary: Submit a review for a completed lesson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid input
        "404":
          description: Not found

  /student/packages:
    get:
      operationId: listStudentPackages
      tags: [student]
      summary: List student's lesson packages and credits
      responses:
        "200":
          description: Lesson packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonPackage"
        "401":
          description: Unauthorized

  /student/tour-complete:
    patch:
      operationId: completeTour
      tags: [student]
      summary: Mark the onboarding tour as seen for the current student
      responses:
        "200":
          description: Tour marked complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasSeenTour:
                    type: boolean
                required:
                  - hasSeenTour
        "401":
          description: Unauthorized

  /student/messages:
    get:
      operationId: listStudentMessages
      tags: [student]
      summary: Get the student's message thread with the teacher
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          description: Unauthorized
    post:
      operationId: sendStudentMessage
      tags: [student]
      summary: Send a message to the teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Unauthorized

  /student/reports:
    post:
      operationId: createStudentReport
      tags: [student]
      summary: Report a message, homework file, or file general feedback about your teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Invalid target for this report type
        "401":
          description: Unauthorized

  # ─── TEACHER ──────────────────────────────────────────────────────────────
  /teachers/me:
    get:
      operationId: getTeacherMe
      tags: [teacher]
      summary: Get the current Clerk user's teacher row, if any
      responses:
        "200":
          description: Teacher row for the signed-in Clerk user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
        "401":
          description: Unauthorized
        "404":
          description: No teacher row is linked to this Clerk user yet

  /teachers/register:
    post:
      operationId: registerTeacher
      tags: [teacher]
      summary: Register a brand-new teacher account for the current Clerk user
      responses:
        "201":
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
        "401":
          description: Unauthorized
        "409":
          description: This Clerk user is already linked to a teacher row

  /teachers/claim:
    post:
      operationId: claimTeacher
      tags: [teacher]
      summary: Link the current Clerk user to an existing unclaimed teacher row via password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimTeacherInput"
      responses:
        "200":
          description: Teacher row claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
        "401":
          description: Invalid password
        "409":
          description: No unclaimed teacher row is available to claim, or this Clerk user already has one

  # ─── TEACHER (operational) ─────────────────────────────────────────────────
  /teacher/dashboard:
    get:
      operationId: getTeacherDashboard
      tags: [teacher]
      summary: Get teacher dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDashboard"
        "401":
          description: Unauthorized

  /teacher/bookings:
    get:
      operationId: listTeacherBookings
      tags: [teacher]
      summary: List all bookings
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: All bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherBooking"
        "401":
          description: Unauthorized

  /teacher/bookings/{id}:
    patch:
      operationId: updateTeacherBooking
      tags: [teacher]
      summary: Update a booking status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherBookingUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherBooking"
        "404":
          description: Not found

  /teacher/bookings/{id}/complete:
    patch:
      operationId: completeBooking
      tags: [teacher]
      summary: Complete a lesson with a recap and optional homework assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteBookingInput"
      responses:
        "200":
          description: Booking marked completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedBooking"
        "400":
          description: Invalid input
        "404":
          description: Not found

  /teacher/lesson-types:
    get:
      operationId: listTeacherLessonTypes
      tags: [teacher]
      summary: List all lesson types (including inactive)
      responses:
        "200":
          description: All lesson types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonType"
    post:
      operationId: createLessonType
      tags: [teacher]
      summary: Create a new lesson type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonTypeInput"
      responses:
        "201":
          description: Created lesson type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonType"

  /teacher/lesson-types/{id}:
    patch:
      operationId: updateLessonType
      tags: [teacher]
      summary: Update a lesson type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonTypeUpdate"
      responses:
        "200":
          description: Updated lesson type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonType"
        "404":
          description: Not found
    delete:
      operationId: deleteLessonType
      tags: [teacher]
      summary: Delete a lesson type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /teacher/lesson-type-packages:
    get:
      operationId: listTeacherLessonTypePackages
      tags: [teacher]
      summary: List all packages (including inactive)
      responses:
        "200":
          description: All packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonTypePackage"
    post:
      operationId: createLessonTypePackage
      tags: [teacher]
      summary: Create a bulk package for a lesson type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonTypePackageInput"
      responses:
        "201":
          description: Created package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonTypePackage"

  /teacher/lesson-type-packages/{id}:
    patch:
      operationId: updateLessonTypePackage
      tags: [teacher]
      summary: Update a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonTypePackageUpdate"
      responses:
        "200":
          description: Updated package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonTypePackage"
        "404":
          description: Not found
    delete:
      operationId: deleteLessonTypePackage
      tags: [teacher]
      summary: Retire a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Retired

  /teacher/package-requests:
    get:
      operationId: listTeacherPackageRequests
      tags: [teacher]
      summary: List package purchase requests
      responses:
        "200":
          description: All requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackageRequest"

  /teacher/package-requests/{id}:
    patch:
      operationId: resolvePackageRequest
      tags: [teacher]
      summary: Mark a package request paid or declined
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageRequestResolve"
      responses:
        "200":
          description: Resolved request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageRequest"
        "404":
          description: Not found
        "409":
          description: Already resolved

  /teacher/bookings/{id}/mark-paid:
    patch:
      operationId: markBookingPaid
      tags: [teacher]
      summary: Confirm payment for a one-off booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated booking payment state
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  paymentStatus:
                    type: string
                  priceCents:
                    type: number
                  paidAt:
                    type: string
                    format: date-time
                    nullable: true
                required:
                  - id
                  - paymentStatus
                  - priceCents
        "404":
          description: Not found
        "409":
          description: Not awaiting payment

  /student/package-requests:
    get:
      operationId: listStudentPackageRequests
      tags: [student]
      summary: List my package requests
      responses:
        "200":
          description: My requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackageRequest"
    post:
      operationId: createPackageRequest
      tags: [student]
      summary: Request to buy a package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageRequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageRequest"
        "404":
          description: Package not found
  /teacher/homework:
    get:
      operationId: listTeacherHomework
      tags: [teacher]
      summary: List all homework submissions
      parameters:
        - name: reviewed
          in: query
          required: false
          schema:
            type: boolean
        - name: studentId
          in: query
          required: false
          schema:
            type: number
        - name: submitted
          in: query
          required: false
          description: Defaults to true (existing behavior — only submitted homework). Set to false to include assigned-but-unsubmitted homework too.
          schema:
            type: boolean
      responses:
        "200":
          description: All homework
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherHomework"
        "401":
          description: Unauthorized

  /teacher/homework/{id}:
    patch:
      operationId: updateHomework
      tags: [teacher]
      summary: Add tutor feedback and grade to homework
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeworkFeedbackInput"
      responses:
        "200":
          description: Updated homework
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherHomework"
        "404":
          description: Not found

  /teacher/homework/{id}/files:
    post:
      operationId: attachHomeworkFile
      tags: [teacher]
      summary: Attach an assigned or review file to a homework row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachHomeworkFileInput"
      responses:
        "201":
          description: Updated homework
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherHomework"
        "404":
          description: Not found

  /teacher/homework/{id}/files/{fileId}:
    delete:
      operationId: deleteHomeworkFile
      tags: [teacher]
      summary: Delete one attached homework file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: fileId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated homework
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherHomework"
        "404":
          description: Not found
    patch:
      operationId: relinkHomeworkFile
      tags: [teacher]
      summary: Re-pair a submission/review file with a different original/submission file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: fileId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true

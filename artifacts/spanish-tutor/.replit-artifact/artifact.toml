kind = "web"
previewPath = "/"
title = "LaCastia"
version = "1.0.0"
id = "artifacts/spanish-tutor"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19653

[services.development]
run = "pnpm --filter @workspace/spanish-tutor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spanish-tutor", "run", "build" ]
serve = "static"
publicDir = "artifacts/spanish-tutor/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19653"
BASE_PATH = "/"
